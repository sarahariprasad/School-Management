{% extends "base.html" %}
{% block title %}Password Updated | School ERP{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="card shadow-lg border-0">
          <div class="card-body p-4 p-lg-5 text-center">

            <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
            <h3 class="fw-bold mt-3 mb-2">Password Updated</h3>
            <p class="text-muted mb-4">
              Your password has been reset successfully. You can now sign in with your new password.
            </p>

            <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
