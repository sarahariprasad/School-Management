{% extends "base.html" %}
{% load static %}
{% block title %}Password Updated | School ERP{% endblock %}
{% block content %}

<!-- Background wrapper (same as login) -->
<div class="d-flex justify-content-center align-items-center min-vh-100 login-background">
  <div class="col-md-5">
    <div class="card shadow-lg">
      <div class="card-body p-4 text-center">
        <h2 class="mb-3">Password updated</h2>
        <p class="text-muted mb-4">
          Your password has been reset successfully.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100">
          Sign in now
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
